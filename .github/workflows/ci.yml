name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shared UI assets and Laravel locale catalogs
        run: |
          python3 scripts/build-ui-icons.py --check
          python3 scripts/build-ui-i18n.py --check
          python3 scripts/check-laravel-host-locales.py
          python3 scripts/sync-plugin-ui.py --check

  list:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Pull requests build only the plugins they touch, directly or through a
      # shared crate; pushes to main and CI changes build every plugin.
      - id: list
        env:
          EVENT: ${{ github.event_name }}
        run: |
          all=$(for f in plugins/*/Cargo.toml; do basename "$(dirname "$f")"; done)
          selected=$all

          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)

            if ! grep -qx '.github/workflows/ci.yml' <<< "$changed"; then
              crates=$(sed -n 's#^crates/\([^/]*\)/.*#\1#p' <<< "$changed" | sort -u)
              selected=$(for p in $all; do
                if grep -q "^plugins/$p/" <<< "$changed"; then
                  echo "$p"
                  continue
                fi
                for c in $crates; do
                  if grep -rqs --include=Cargo.toml "crates/$c\"" "plugins/$p"; then
                    echo "$p"
                    break
                  fi
                done
              done)
            fi
          fi

          plugins=$(printf '%s\n' $selected | jq -R . | jq -sc 'map(select(length > 0))')
          echo "Plugins to build: $plugins"
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  crates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [spring-text, ui-kit]
    defaults:
      run:
        working-directory: crates/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.name }}

      - run: cargo test

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: plugin.toml versions match the release-please manifest
        run: |
          status=0
          for dir in $(jq -r 'keys[]' .release-please-manifest.json); do
            expected=$(jq -r --arg d "$dir" '.[$d]' .release-please-manifest.json)
            actual=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' "$dir/plugin.toml" | head -1)
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$dir/plugin.toml::version $actual differs from the release-please manifest ($expected); release-please bumps it, do not edit it by hand"
              status=1
            fi
          done
          exit $status

  plugin:
    needs: list
    if: needs.list.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.plugins) }}
    defaults:
      run:
        working-directory: plugins/${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/${{ matrix.name }}

      - run: cargo test

      - run: cargo build --release --target wasm32-wasip2

      - name: Validate fresh non-Laravel packages with released API 1.4
        if: matrix.name != 'laravel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.1.47 --repo l0ng-ai/openidea \
            --pattern openidea-plugin-linux-x86_64.gz --dir "$RUNNER_TEMP"
          gzip -dc "$RUNNER_TEMP/openidea-plugin-linux-x86_64.gz" > "$RUNNER_TEMP/openidea-plugin"
          chmod +x "$RUNNER_TEMP/openidea-plugin"
          "$RUNNER_TEMP/openidea-plugin" build
