id = "aritti.dependency-audit"
name = "Dependency Audit"
version = "0.3.0" # x-release-please-version
description = "Checks Maven, Gradle, npm, yarn, pnpm, Composer, PyPI and Cargo dependencies against the OSV.dev vulnerability database. Live editor diagnostics use cached results and show their query dates; fetching runs only on open/save or an explicit scan. Vulnerable dependencies are marked in pom.xml, build.gradle, build.gradle.kts, package.json, composer.json, Python and Rust dependency files and their lockfiles when you open or save them, with a quick fix that upgrades to the nearest fixed version. Dependency Audit: Scan Project lists the project's vulnerable dependencies in the Dependency Audit tool window. Privacy: package names and versions (never source code) are sent to api.osv.dev, a free service run by Google. Turn off Check on open and save under Settings › Plugins › Dependency Audit to contact it only when you run a scan."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Files with findings show a vulnerability count in the project tree, vulnerable lines show the advisory and fixed version, and Preview Upgrade opens a diff first; Maven and Gradle versions come from the dependency graph the IDE already resolved, and mvn or gradle runs after a scan only when that setting is on and the IDE has none, and says once why it could not run; findings show where a dependency is declared, with Go to declaration and the chain for indirect ones, and a project without dependency files lists the supported ones; scans pyproject.toml, pylock.toml, uv.lock and poetry.lock, PyPI and Maven results show whether your code imports the package, and private-registry packages are never sent to OSV.dev; version parsing fixes for Yarn, pnpm, npm, Gradle and PyPI, quick fixes ask you to save first, palette row commands let you pick a dependency, messages name the permission to allow, ignored findings and window tabs have plainer names, and the npm lockfile graph size limit is a setting. \
0.3.0: new hub window, dependency resolution and import-level evidence. \
0.2.0: plugin icon, audit rows, and quick fix that audits every library sharing the bumped version."""
categories = ["linters", "tools"]
icon = "icon.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-event:file-opened", "on-event:file-saved", "on-view:vulnerabilities"]

[capabilities]
required = ["project.read", "storage"]
optional = ["project.write", "process:sbt", "process:osv-scanner-macho", "process:osv-scanner", "process:mvn", "process:gradle", "editor.read", "editor.write", "events", "vcs.read", "net:api.osv.dev", "build.read"]

