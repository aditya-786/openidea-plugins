id = "aritti.spring-initializr"
name = "Spring Initializr Launcher"
version = "0.3.0" # x-release-please-version
description = "Starts a Spring Boot project from a tool window. Pick the build, language, Spring Boot and Java versions, coordinates, packaging and dependencies. Generate and Open creates the project from start.spring.io in a folder you choose, Download ZIP gets the project zip from a Spring Initializr server (start.spring.io or your own) in the browser, Explore in Browser opens the server's web page with the same options, and Run Spring Boot CLI in Terminal runs `spring init` in an IDE terminal when the Spring Boot CLI is allowed. The plugin remembers the form."
authors = ["Arnaud RITTI <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Generate and Open is the main button with one confirmation and falls back to the browser download without its permissions, Generate Project is renamed Download ZIP, and artifact problems show before you click; with the optional project.write permission, Add Spring Boot Starters writes the build file after one confirmation (otherwise one ⌥⏎ action inserts them) and supports more Maven and Gradle layouts, including version catalogs; generated ZIPs keep executable scripts, the downloaded archive is deleted afterwards and a failed extract shows the kept folder, Import Maven Project creates the files after one confirmation, never overwriting any, and Open Source Folder, in Tools, opens without asking again; Generate and Open and source-only import are off for custom servers and refuse folders that are not on the machine running the project; unsaved form changes survive switching projects, the plugin no longer wakes when a pom.xml opens, the status line is one sentence, CLI buttons use plain names and Tools shows Add Starters only in Maven and Gradle projects. \
0.3.0: Add Starters for Maven and Gradle and project generation. \
0.2.0: plugin icon and server list."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-view:initializr"]

[capabilities]
required = ["storage"]
optional = ["project.read", "process:spring", "process:python3", "net:start.spring.io", "editor.read", "project.write"]

[[contributes.commands]]
id = "open-start"
title = "Spring Initializr: Open start.spring.io"
category = "Spring Initializr"

[[contributes.views]]
id = "initializr"
title = "Spring Initializr"
icon = "icons/springboot.svg"
location = "right"
web = "web/resources/hub.html"

[[contributes.commands]]
id = "add-starters"
title = "Spring Initializr: Add Spring Boot Starters…"
category = "Spring Initializr"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts"

[[contributes.menus]]
menu = "tools"
command = "add-starters"
when = "workspaceContains:pom.xml || workspaceContains:build.gradle || workspaceContains:build.gradle.kts"

[[contributes.providers]]
kinds = ["code-actions"]
languages = ["*"]

[[contributes.commands]]
id = "prepare-import"
title = "Spring Initializr: Import Maven Project…"
category = "Spring Initializr"

[[contributes.commands]]
id = "open-reviewed-import"
title = "Spring Initializr: Open Source Folder"
category = "Spring Initializr"
when = "plugin.aritti.spring-initializr.importReady"

[[contributes.menus]]
menu = "tools"
command = "prepare-import"

[[contributes.menus]]
menu = "tools"
command = "open-reviewed-import"
when = "plugin.aritti.spring-initializr.importReady"

[[contributes.commands]]
id = "generate-archive"
title = "Spring Initializr: Generate and Open…"
category = "Spring Initializr"
