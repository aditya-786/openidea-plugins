<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>API Preview</title>
    <link rel="stylesheet" href="./resources/tokens.css" />
    <link rel="stylesheet" href="./resources/components.css" />
    <link rel="stylesheet" href="./vendor/swagger-ui.css" />
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body class="ui-embedded-panel">
    <header class="api-toolbar ui-toolbar" aria-label="API preview actions"><button id="reload" type="button" class="ui-button"><span data-ui-icon="update" data-ui-icon-size="16"></span>Reload</button><button id="switch" type="button" class="ui-button" aria-label="Switch API renderer to Redoc"><span data-ui-icon="eye" data-ui-icon-size="16"></span><span data-renderer-label>Redoc</span></button><button id="try" type="button" class="ui-button" title="Prepare a GET or HEAD request from this spec; nothing is sent until you confirm"><span data-ui-icon="send" data-ui-icon-size="16"></span>Try…</button></header>
    <div id="swagger" data-ui-raw role="region" aria-label="Swagger API preview"></div>
    <div id="redoc" data-ui-raw role="region" aria-label="Redoc API preview"></div>
    <script src="./resources/native-icons.js"></script><script src="./resources/icons.js"></script><script src="./resources/widgets.js"></script><script src="./resources/controls.js"></script>
    <script src="./vendor/swagger-ui-bundle.js"></script>
    <script src="./main.js"></script>
  </body>
</html>
