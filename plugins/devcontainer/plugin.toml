id = "aritti.devcontainer"
name = "Dev Container CLI"
version = "0.3.0" # x-release-please-version
description = "Starts, rebuilds and stops the project's Dev Container (containers.dev) and opens a shell in it, using the devcontainer CLI. Creates Dev Container configurations from bundled image templates with optional cached feature selection, without running a CLI. Adds a devcontainer.json template to the New menu. Requires the devcontainer CLI (npm i -g @devcontainers/cli) and Docker. The IDE itself keeps running on the host."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: Open Shell reuses the running terminal, starting from the Dev Containers view offers Open Shell, the empty view offers Create and Start and Rebuild and points to New › Dev Container Configuration when there is none, and Stop asks first, names the containers and removes the run target only once they stop. Run and Test tell you when no dev container is running, and refuse to launch when the registered container was rebuilt or Docker is not reachable; Compose services, ports, volumes and feature options in devcontainer.json are checked, with cached checks so typing stays fast, and gutter icons open its Compose files and Dockerfile; choose between several configurations, and extra volume mounts below the project folder no longer block registration; Start and Rebuild run as cancellable background runs, and Clone Repository and Start runs git in a terminal; clearer command names, messages and permission prompts, configuration commands are greyed out in projects without one, and the plugin no longer loads on every file open and save. \
0.3.0: Compose and feature checks and a unified Services window. \
0.2.0: plugin icon, container list with Open Shell, Stop and Start."""
categories = ["tools"]
icon = "icon.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-view:containers", "on-view:run-target-review"]

[capabilities]
required = ["project.read"]
# git: Clone Repository and Start. storage: per-project configuration choices and feature cache. net:containers.dev: Refresh Feature List.
optional = ["process:devcontainer", "process:docker", "process:git", "storage", "net:containers.dev"]

[[contributes.commands]]
id = "up-managed"
title = "Dev Container: Start Container in Background…"
category = "Dev Container"
when = "workspaceContains:.devcontainer || workspaceContains:.devcontainer.json"

[[contributes.commands]]
id = "rebuild-managed"
