[package]
name = "openidea-plugin-ddev"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ui-kit = { path = "../../crates/ui-kit" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.47" }
serde_json = "1"
url = "2"
toml_edit = "0.25"
shell-words = "1"
yaml-rust2 = { version = "0.13", default-features = false }
jsonschema = { version = "0.60", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
