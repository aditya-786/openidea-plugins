[package]
name = "openidea-plugin-gitlab"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ui-kit = { path = "../../crates/ui-kit" }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.47" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
url = "2.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
