[[contributes.mcpTools]]
name = "routes"
description = "List routes from the cached source index as CSV: name, methods, path, controller and file. Optional text filter and pagination."
inputSchema = "mcp/routes.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "services"
description = "List services from the cached source index as CSV: id, class or alias, and file. Optional text filter and pagination."
inputSchema = "mcp/services.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "commands"
description = "List console commands from the cached source index as CSV: name, class and file. Optional text filter and pagination."
inputSchema = "mcp/commands.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "templates"
description = "List Twig templates from the cached source index as CSV: name and file. Optional text filter and pagination."
inputSchema = "mcp/templates.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "template_usage"
description = "Find where a Twig template is used: controllers rendering it and templates extending, including, embedding or importing it, as CSV."
inputSchema = "mcp/template_usage.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "profiler_requests"
description = "List recent profiler requests from the project's profiler index file as CSV: token, method, redacted URL, status and time. Reads a file only; no PHP runs."
inputSchema = "mcp/profiler_requests.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "entities"
description = "List Doctrine entities from #[ORM\\Entity] attributes as CSV: class, table, repository, fields, relations and file. Optional text filter and pagination."
inputSchema = "mcp/entities.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "parameters"
description = "List container parameter names from the cached source index as CSV: name and file. Values are not read. Optional text filter and pagination."
inputSchema = "mcp/parameters.schema.json"
readOnly = true
destructive = false

[[contributes.mcpTools]]
name = "env"
description = "List the variable names of the project's .env files as CSV with the files defining them. Values are never returned."
inputSchema = "mcp/env.schema.json"
readOnly = true
destructive = false
