id = "aritti.symfony"
name = "Symfony"
version = "0.3.0" # x-release-please-version
description = """Symfony support in PHP, Twig, YAML and XML files. Completion and go to definition for routes, Twig templates and blocks, services, classes, translation keys (per domain), assets, Encore and AssetMapper entries, and roles, plus completion of the variables controllers pass to a Twig template. Reports missing routes, templates, services and translation keys, and routes defined twice in a file, with a quick fix that adds a missing key. Hover on a declaration shows the matching source candidates. A Symfony tool window lists routes, templates, services and translations, two commands run cache:warmup and cache:clear, and a Profiler view lists the latest requests. Twig files need the aritti.twig plugin."""
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
homepage = "https://github.com/arnaud-ritti/openidea-plugins/tree/main/plugins/symfony"
license = "MIT"
change-notes = """\
Next release: Copy Route as cURL and Create HTTP Request File ask which route to use when run from the command palette, Symfony commands only show in Symfony projects, Extend Twig Template and Insert Form Rows only show in Twig files, and Go to Route and Go to Service get Alt+Shift+U and Alt+Shift+S. Window with Routes, Templates, Services, Translations, Config, Env, Entities, About and Processes tabs, each listed as a searchable table with columns and filters; read-only MCP tools and completion for Stimulus controllers, Vite entries and Twig components, type-based completion in Twig and PHP; saving a file updates only its index entries so completion no longer stalls on large projects, route usages get a gutter icon, and controllers, entities and templates a Related files icon listing their routes, templates and entity family; renaming a route updates its declaration and every usage, console arguments keep quoted values, and no more crashes on accents or emoji; New commands create the file, short setting titles, plainer Profiler, occurrence, deprecation, create-file and permission messages. \
0.3.0: indexer, Twig and Doctrine support. \
0.2.0: plugin icon and route navigation."""
categories = ["frameworks"]
icon = "icon.svg"
engines.openidea = "^1.10"
wasm = "dist/plugin.wasm"
activation = ["on-view:symfony", "on-file:**/composer.json", "on-language:php", "on-language:twig", "on-language:yaml", "on-language:xml"]

[capabilities]
required = ["project.read"]
# Cache: Warm Up / Clear run `php bin/console`; everything else works without it.
# process:symfony: the Processes tab opens `symfony serve` / `symfony server:log` in a terminal tab; Messenger and scheduler workers use process:php.
# editor.*: Twig: Extend Template inserts the extends tag.
# events: cross-file problems refresh on open/save; source-local syntax uses the live provider.
# Missing-template creation uses reviewed native FileActions, with no process grant.
optional = ["project.write", "process:php", "process:symfony", "events", "editor.read", "editor.write", "clipboard", "storage"]

