[package]
name = "openidea-plugin-symfony"
version = "0.1.0"
edition = "2024"
publish = false

# A plugin builds on its own (target wasm32-wasip2), outside any IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
serde_json = "1"
shell-words = "1"
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.47" }
ui-kit = { path = "../../crates/ui-kit" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
