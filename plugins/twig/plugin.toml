id = "aritti.twig"
name = "Twig"
version = "0.3.0" # x-release-please-version
description = "Twig support for .twig files: highlighting of Twig and the HTML around it, blocks and macros in the structure view, folding of tag pairs and multi-line comments, completion of tags, filters, functions, tests and imported macros, Go to Declaration for macros and templates, thirteen snippets (blk, mcr, esc, emb, ext, for, from, if, imp, inc, sbx, spl, verb), and inspections for unclosed tags, unexpected end tags and unterminated delimiters."
authors = ["Arnaud Ritti <arnaud.ritti@gmail.com>"]
license = "MIT"
change-notes = """\
Next release: A quick fix inserts the missing end tag of an unclosed tag using the configured delimiters, and code lenses read 1 occurrence or N occurrences in this file; twig.paths and default_path resolve template names, including dev, prod and test overrides, templateNamespaces map @namespace/ names, and render() variables complete in expressions; faster editing: PHP files are no longer scanned while you type, and project filters, functions and controller variables refresh when PHP files change; injected JavaScript and CSS keep working after a stray <, and Twig no longer asks for write access to your project; block() jumps to its block, gutter icons link parent, child and including templates and overridden blocks, Preview Rename Macro Parameter, clearer setting descriptions, rename previews and permission messages, and Toggle Comment and Show Occurrences show in Twig files only. \
0.3.0: template and macro navigation. \
0.2.0: plugin icon and tag completion."""
categories = ["languages"]
icon = "icon.svg"
engines.openidea = "^1.10"
# Highlighting, structure and folding come from this component; it is loaded
# when the first Twig file is opened.
wasm = "dist/plugin.wasm"
activation = ["on-language:twig"]

[capabilities]
required = ["project.read"]
# events: the inspections run when a Twig file is opened or saved.
optional = ["events", "editor.read", "editor.write", "process:php"]

[contributes.settings]
schema = "settings.schema.json"
title = "Twig"

[[contributes.providers]]
kinds = ["completion", "definition", "injections", "line-markers"]
languages = ["twig"]

# Gutter icon on the first (or extends) line listing parent, child and including templates.
[[contributes.markerIcons]]
id = "related"
icon = "icons/twig-logo.svg"

[[contributes.languages]]
path = "languages/twig.toml"

[[contributes.fileIcons]]
id = "twig"
patterns = ["*.twig"]
icon = "icons/twig.svg"
iconDark = "icons/twig_dark.svg"

[[contributes.providers]]
kinds = ["diagnostics"]
languages = ["twig"]

[[contributes.providers]]
kinds = ["hover"]
languages = ["twig"]

[[contributes.commands]]
id = "toggle-comment"
title = "Twig: Toggle Comment"
category = "Twig"
when = "editorLangId == twig"

[[contributes.providers]]
kinds = ["formatting", "signature-help", "document-highlights", "code-lenses", "code-actions"]
languages = ["twig"]

[[contributes.commands]]
id = "source-symbol-occurrences"
title = "Twig: Show Occurrences"
category = "Twig"
when = "editorLangId == twig"
